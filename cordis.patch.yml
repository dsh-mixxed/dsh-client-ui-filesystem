# The ui-filesystem bundle patch: mounts the '@' project file/directory
# suggestions plugin row. Declared through `dsh.bundle.patch` in package.json,
# so `dsh plugin --profile <name> add @dsh-mixxed/dsh-client-ui-filesystem`
# automatically appends this package to the profile's `dsh.profile.bundles`
# layer stack and the row mounts on the next boot — no manual
# cordis.patch.yml edit needed. `id` is the cordis plugin id (ui-filesystem);
# `name` is the package specifier the loader resolves (the npm package name,
# quoted because '@' is a reserved YAML indicator).
- insert:
    - id: ui-filesystem
      name: "@dsh-mixxed/dsh-client-ui-filesystem"
